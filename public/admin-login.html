<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - RS Furniture</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background:
                radial-gradient(
                    circle at top,
                    rgba(146, 64, 14, 0.15),
                    transparent 45%
                ),
                #f5f5f4;
        }

        .login-card {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shake {
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <div class="login-card w-full max-w-md">

        <!-- Logo / Brand -->

        <div class="text-center mb-6">

            <div class="inline-flex items-center justify-center
                        w-16 h-16 rounded-2xl
                        bg-amber-900 text-white
                        shadow-lg mb-4">

                <span class="text-2xl font-black">
                    RS
                </span>

            </div>

            <h1 class="text-2xl font-black text-gray-900">
                RS FURNITURE
            </h1>

            <p class="text-sm text-gray-500 mt-1">
                Panel Administrasi
            </p>

        </div>


        <!-- Login Card -->

        <div id="loginCard"
             class="bg-white rounded-2xl border border-stone-200
                    shadow-xl p-6 sm:p-8">

            <div class="text-center mb-6">

                <div class="text-4xl mb-3">
                    🔐
                </div>

                <h2 class="text-xl font-bold text-gray-900">
                    Masukkan PIN Admin
                </h2>

                <p class="text-sm text-gray-500 mt-2">
                    Masukkan PIN untuk mengakses panel admin.
                </p>

            </div>


            <!-- PIN Form -->

            <form id="loginForm">

                <label
                    for="pinInput"
                    class="block text-sm font-semibold text-gray-700 mb-2"
                >
                    PIN Admin
                </label>


                <div class="relative">

                    <input
                        id="pinInput"
                        type="password"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="6"
                        placeholder="••••••"
                        class="w-full px-4 py-3 pr-12
                               border border-stone-300
                               rounded-xl
                               text-center text-xl tracking-[0.5em]
                               font-bold
                               focus:outline-none
                               focus:ring-2
                               focus:ring-amber-700
                               focus:border-amber-700"
                        required
                    >

                    <button
                        type="button"
                        id="togglePin"
                        class="absolute right-3 top-1/2
                               -translate-y-1/2
                               text-gray-400
                               hover:text-gray-700"
                    >
                        👁
                    </button>

                </div>


                <!-- Error -->

                <div
                    id="errorMessage"
                    class="hidden mt-3 text-sm text-red-600
                           bg-red-50 border border-red-200
                           rounded-lg p-3 text-center"
                >
                    PIN yang kamu masukkan salah.
                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="w-full mt-5
                           bg-amber-900
                           hover:bg-amber-950
                           text-white
                           font-bold
                           py-3
                           rounded-xl
                           transition
                           shadow-lg"
                >
                    Masuk ke Panel Admin
                </button>

            </form>


            <!-- Back -->

            <a
                href="/"
                class="block text-center
                       text-sm text-gray-500
                       hover:text-amber-800
                       mt-5"
            >
                ← Kembali ke Katalog
            </a>

        </div>


        <p class="text-center text-xs text-gray-400 mt-5">
            © 2026 RS Furniture
        </p>

    </div>


    <script>

        // ==========================================
        // PIN ADMIN
        // ==========================================

        const ADMIN_PIN = "211204";


        // ==========================================
        // ELEMENTS
        // ==========================================

        const loginForm = document.getElementById("loginForm");

        const pinInput = document.getElementById("pinInput");

        const errorMessage = document.getElementById("errorMessage");

        const loginCard = document.getElementById("loginCard");

        const togglePin = document.getElementById("togglePin");


        // ==========================================
        // SHOW / HIDE PIN
        // ==========================================

        togglePin.addEventListener("click", () => {

            if (pinInput.type === "password") {

                pinInput.type = "text";

                togglePin.textContent = "🙈";

            } else {

                pinInput.type = "password";

                togglePin.textContent = "👁";

            }

            pinInput.focus();

        });


        // ==========================================
        // LOGIN
        // ==========================================

        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();


            const enteredPin = pinInput.value.trim();


            // Reset error

            errorMessage.classList.add("hidden");

            loginCard.classList.remove("shake");


            // Cek PIN

            if (enteredPin === ADMIN_PIN) {

                // Simpan status login
                sessionStorage.setItem(
                    "rsFurnitureAdmin",
                    "true"
                );


                // Masuk admin

                window.location.href = "/admin.html";

            } else {

                errorMessage.classList.remove("hidden");

                loginCard.classList.add("shake");

                pinInput.value = "";

                pinInput.focus();

            }

        });


        // ==========================================
        // AUTO FOCUS
        // ==========================================

        pinInput.focus();

    </script>

</body>
</html>
